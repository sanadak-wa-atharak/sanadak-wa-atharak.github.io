<title>سندك وأثرك</title>

<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #F7F0E3; --ink: #0E3B3D; --muted: #3C5F60;
  --card: #EADFC8; --field: #FFFFFF; --border: #CFC2A6;
  --accent: #B94F32; --on-accent: #FFFFFF;
  --deep: #0E3B3D; --on-deep: #F3DDB0; --on-deep-muted: #CDBE98;
  --calm-bg: #0E3B3D; --calm-ink: #F3DDB0; --calm-muted: #CDBE98; --calm-card: #F7F0E3; --calm-card-ink: #0E3B3D;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A2B2D; --ink: #F3DDB0; --muted: #CDBE98;
    --card: #12474A; --field: #0F3A3D; --border: #2A6064;
    --accent: #C4553A; --on-accent: #FFFFFF;
    --deep: #134A4D; --on-deep: #F3DDB0; --on-deep-muted: #CDBE98;
    --calm-bg: #08262A; --calm-ink: #F3DDB0; --calm-muted: #CDBE98; --calm-card: #F7F0E3; --calm-card-ink: #0E3B3D;
  }
}
:root[data-theme="dark"] {
  --bg: #0A2B2D; --ink: #F3DDB0; --muted: #CDBE98;
  --card: #12474A; --field: #0F3A3D; --border: #2A6064;
  --accent: #C4553A; --on-accent: #FFFFFF;
  --deep: #134A4D; --on-deep: #F3DDB0; --on-deep-muted: #CDBE98;
  --calm-bg: #08262A; --calm-ink: #F3DDB0; --calm-muted: #CDBE98; --calm-card: #F7F0E3; --calm-card-ink: #0E3B3D;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Tajawal', system-ui, sans-serif; min-height: 100vh; transition: background .2s; }
body.calm { background: var(--calm-bg); color: var(--calm-ink); }
#app { max-width: 480px; margin: 0 auto; padding: 28px 22px 40px; display: flex; flex-direction: column; gap: 16px; }
button, textarea { font-family: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.top { display: flex; align-items: center; gap: 12px; min-height: 48px; }
.logo { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; }
.brand { font-size: 22px; font-weight: 700; }
.title { font-size: 24px; font-weight: 700; margin: 0; }
.back { width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--card); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
body.calm .back { background: #1B5558; }
.btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 60px; border-radius: 24px; font-size: 20px; font-weight: 700; border: 2px solid transparent; padding: 10px 16px; text-align: center; }
.btn-accent { background: var(--accent); color: var(--on-accent); }
.btn-big { min-height: 84px; font-size: 26px; }
.btn-deep { background: var(--deep); color: var(--on-deep); }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn-sand { background: #F3DDB0; color: #0E3B3D; }
.btn-link { background: transparent; color: inherit; text-decoration: underline; font-size: 17px; font-weight: 500; min-height: 48px; border: none; }
.pair { display: flex; gap: 10px; }
.pair .btn { min-height: 60px; font-size: 18px; padding: 10px 8px; }
.btn-small { min-height: 44px; font-size: 16px; border-radius: 16px; width: auto; padding: 8px 18px; }
.counter { text-align: start; display: flex; flex-direction: column; gap: 10px; align-items: stretch; background: var(--deep); color: var(--on-deep); border: none; border-radius: 24px; padding: 20px 24px; }
.counter .lbl { font-size: 20px; font-weight: 700; }
.counter .row { display: flex; align-items: baseline; justify-content: space-between; }
.counter .num { font-size: 56px; font-weight: 700; line-height: 1; }
.counter .unit { font-size: 18px; font-weight: 500; margin-inline-start: 10px; }
.counter .more { font-size: 15px; font-weight: 500; }
.card { background: var(--card); border-radius: 24px; padding: 20px 22px; display: flex; flex-direction: column; gap: 8px; }
.card h2 { margin: 0; font-size: 20px; }
.meta { font-size: 14px; font-weight: 500; color: var(--muted); }
.body { font-size: 18px; font-weight: 500; line-height: 1.6; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.seg { display: flex; gap: 10px; }
.seg button { flex: 1; min-height: 52px; border-radius: 26px; font-size: 18px; font-weight: 700; border: 2px solid var(--ink); background: transparent; color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--deep); color: var(--on-deep); border-color: var(--deep); }
label { font-size: 16px; font-weight: 500; }
textarea { width: 100%; border-radius: 20px; border: 2px solid var(--border); background: var(--field); color: var(--ink); padding: 14px 16px; font-size: 17px; line-height: 1.6; resize: vertical; min-height: 120px; direction: rtl; }
textarea.short { min-height: 84px; }
.err { color: var(--accent); font-weight: 700; font-size: 16px; min-height: 22px; margin: 0; }
.toast { background: var(--deep); color: var(--on-deep); border-radius: 16px; padding: 12px 18px; font-weight: 700; }
.small-note { font-size: 13px; color: var(--muted); text-align: center; margin-top: 8px; }
.calm .small-note, .calm .meta { color: var(--calm-muted); }
.kicker { font-size: 18px; font-weight: 500; color: var(--calm-muted); margin: 12px 0 0; }
.big { font-size: 34px; font-weight: 700; line-height: 1.35; margin: 0; }
.calm-card { background: var(--calm-card); color: var(--calm-card-ink); border-radius: 28px; padding: 24px; display: flex; flex-direction: column; gap: 14px; margin-top: 8px; }
.calm-card .meta { color: #3C5F60; }
.badge { display: inline-block; align-self: flex-start; background: #0E3B3D; color: #F3DDB0; border-radius: 14px; padding: 4px 12px; font-size: 14px; font-weight: 700; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.num-big { font-size: 72px; font-weight: 700; line-height: 1; }
.num-row { display: flex; align-items: baseline; gap: 12px; }
.section { font-size: 18px; font-weight: 700; margin: 8px 0 0; }
.item { background: var(--field); border: 2px solid var(--border); border-radius: 20px; padding: 14px 18px; display: flex; flex-direction: column; gap: 6px; }
.item .help { font-size: 16px; font-weight: 500; line-height: 1.5; color: var(--muted); margin: 0; }
</style>
</head>

      h('div', { class: 'top' }, backBtn('home'), h('h1', { class: 'title', text: 'كل تحدي بيعدي' })),
      h('div', { class: 'seg' },
        h('button', { type: 'button', 'aria-pressed': String(isCh), onclick: function () { S.tab = 'challenges'; S.confirmDel = null; render(); }, text: 'التحديات' }),
        h('button', { type: 'button', 'aria-pressed': String(!isCh), onclick: function () { S.tab = 'moments'; S.confirmDel = null; render(); }, text: 'اللحظات' }))
    ];
    if (isCh) {
      var passed = passedList().sort(newestFirst), ongoing = ongoingList().sort(newestFirst);
      out.push(h('div', { class: 'num-row' }, h('div', { class: 'num-big', text: String(passed.length) }), h('div', { class: 'brand', text: 'تحدي عدّى' })));
      if (ongoing.length) {
        out.push(h('p', { class: 'section', text: 'لسه جاري' }));
        ongoing.forEach(function (e) {
          var marking = S.markingId === e.id;
          out.push(h('div', { class: 'item' },
            h('p', { class: 'body', text: e.text }),
            h('div', { class: 'meta', text: ago(e.createdAt) }),
            marking ? [
              h('label', { for: 'mh', text: 'إيه اللي ساعدك تعدّي؟' }),
              h('textarea', { id: 'mh', class: 'short', placeholder: 'جملة واحدة تفتكرها وقت التعب', oninput: function (ev) { S.markHelp = ev.target.value; } }, S.markHelp),
              h('div', { class: 'actions' },
                h('button', { class: 'btn btn-deep btn-small', type: 'button', onclick: function () { e.status = 'passed'; e.help = S.markHelp.trim(); e.passedAt = Date.now(); S.markingId = null; S.markHelp = ''; persist(); render(); }, text: 'عدّى' }),
                h('button', { class: 'btn btn-ghost btn-small', type: 'button', onclick: function () { S.markingId = null; render(); }, text: 'إلغاء' }))
            ] : h('div', { class: 'actions' },
              h('button', { class: 'btn btn-accent btn-small', type: 'button', onclick: function () { S.markingId = e.id; S.markHelp = ''; render(); }, text: 'عدّى' }),
              delButton(e.id))));
        });
      }
      if (passed.length) {
        out.push(h('p', { class: 'section', text: 'عدّى' }));
        passed.forEach(function (e) {
          out.push(h('div', { class: 'item' },
            h('p', { class: 'body', text: e.text }),
            e.help ? h('p', { class: 'help', text: 'اللي ساعدني: ' + e.help }) : null,
            h('div', { class: 'meta', text: ago(e.passedAt || e.createdAt) }),
            h('div', { class: 'actions' }, delButton(e.id))));
        });
      }
      if (!passed.length && !ongoing.length) out.push(h('p', { class: 'body', text: 'لسه مفيش تحديات. سجّل أول واحد.' }));
      out.push(h('button', { class: 'btn btn-accent', type: 'button', onclick: function () { S.kind = 'challenge'; S.status = 'passed'; go('add'); }, text: 'سجّل تحدي' }));
    } else {
      var ms = momentList().sort(newestFirst);
      if (!ms.length) out.push(h('p', { class: 'body', text: 'لسه مفيش لحظات. سجّل أول لحظة حلوة.' }));
      ms.forEach(function (e) {
        out.push(h('div', { class: 'item' },
          h('p', { class: 'body', text: e.text }),
          h('div', { class: 'meta', text: ago(e.createdAt) }),
          h('div', { class: 'actions' }, delButton(e.id))));
      });
      out.push(h('button', { class: 'btn btn-accent', type: 'button', onclick: function () { S.kind = 'moment'; go('add'); }, text: 'سجّل لحظة حلوة' }));
    }
    return out;
  }

  function render() {
    var app = document.getElementById('app');
    while (app.firstChild) app.removeChild(app.firstChild);
    var v = S.view === 'add' ? viewAdd() : S.view === 'tired' ? viewTired() : S.view === 'list' ? viewList() : viewHome();
    (function add(list) {
      list.forEach(function (n) {
        if (!n) return;
        if (Array.isArray(n)) add(n); else app.appendChild(n);
      });
    })(v);
    document.body.className = S.view === 'tired' ? 'calm' : '';
  }

  render();
})();
</script>
</body>
</html>
